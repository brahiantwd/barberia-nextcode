{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Barberia NextCode{% endblock %}</title>
  
    <link rel="stylesheet" href="{% static 'barberia/css/estilos.css' %}">
</head>
<body>

    <header class="main-header">
        <div class="logo-container">
            <span class="logo-icon">✂</span>
            <h1 class="logo-text">NextCode</h1>
        </div>

        <nav class="nav-menu">
            <a href="{% url 'inicio' %}" class="nav-link active">Inicio</a>
            <a href="{% url 'servicios' %}" class="nav-link">Servicios</a>
            <a href="#" class="nav-link">Barberos</a>
            <a href="#" class="nav-link">Reservas</a>
            <a href="#" class="nav-link">Contacto</a>
        </nav>

        <div class="auth-buttons">
            <a href="{% url 'login' %}" class="btn-outline">Iniciar sesión</a>
            <a href="{% url 'clientes' %}" class="btn-solid">Registrarse</a>
            <a href="/admin/" class="btn-dark">Admin</a>
        </div>
    </header>

  
    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
